[project]
name = "desktop-harness"
version = "0.6.5"
description = "Agent hands for your Mac — AX-first desktop control CLI for Grok Build and coding agents"
requires-python = ">=3.10"
dependencies = [
    "pyobjc-framework-Quartz",
    "pyobjc-framework-Cocoa",
    "pyobjc-framework-ApplicationServices",
]

[project.scripts]
desktop-harness = "desktop_harness.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/desktop_harness"]

[tool.hatch.build.targets.wheel.force-include]
"SKILL.md" = "desktop_harness/data/SKILL.md"
